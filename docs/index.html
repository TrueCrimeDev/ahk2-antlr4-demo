<!DOCTYPE html><html lang=en><link rel=stylesheet href=ahk2-antlr4-demo.1d7ec983.css><meta charset=utf-8><meta name=viewport content="width=device-width, initial-scale=1"><title>AHK v2 AST Explorer</title><meta name=theme-color content=#0D0D0D><link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233B82F6'/%3E%3Cg fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='12' y='5' width='8' height='6' rx='1.5'/%3E%3Crect x='5' y='21' width='8' height='6' rx='1.5'/%3E%3Crect x='19' y='21' width='8' height='6' rx='1.5'/%3E%3Cpath d='M16 11v5M9 21v-3h14v3'/%3E%3C/g%3E%3C/svg%3E"><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel=stylesheet><link rel=stylesheet href=ahk2-antlr4-demo.90d5706f.css><body data-tab=graph>
    <header class=app-header>
        <div class=app-logo aria-hidden=true>
            <svg width=20 height=20 fill=none stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24"><rect width=6 height=5 x=9 y=3 rx=1.2 /><rect width=6 height=5 x=3 y=16 rx=1.2 /><rect width=6 height=5 x=15 y=16 rx=1.2 /><path d="M12 8v4m-6 4v-2.5h12V16"/></svg>
        </div>
        <div>
            <h1>AutoHotkey v2 AST Explorer</h1>
            <p class=byline>
                ANTLR4 grammar by <a href=https://github.com/Descolada/ahk2-antlr4-demo>Descolada</a>.
                Fork with source linking, lint checks and extra views:
                <a href=https://github.com/TrueCrimeDev/ahk2-antlr4-demo>TrueCrimeDev/ahk2-antlr4-demo</a>
            </p>
        </div>
        <button id=open-palette class=palette-btn title="Jump to a symbol, open an example or run a command (Ctrl+K)">Go to anything</button>
    </header>

    <main class=container>
        <section class=left>
            <div class=examples-bar>
                <label for=examples>Example</label>
                <button id=ex-prev class=step title="Previous example" aria-label="Previous example">‹</button>
                <select id=examples></select>
                <button id=ex-next class=step title="Next example" aria-label="Next example">›</button>
                <button id=ex-reset title="Restore the original example; get your edits back with (Ctrl+Z)" hidden>Reset</button>
                <button id=share class=primary title="Copy a link that opens this code">Share</button>
                <button id=open-file title="Open an .ahk file (or drop one on the editor)">Open…</button>
                <input type=file id=file-input accept=.ahk,.ah2,.ahk2,.txt hidden>
            </div>
            <p id=ex-note class=ex-note></p>
            <div class=editor-area>
                <textarea id=input rows=10 cols=60>; Type AutoHotkey v2 code here to see its AST.
; Click a tree node to highlight its code, or move the cursor to find its node.

#Requires AutoHotkey v2.0

x := 1
Pair(x, x := 2)        ; warning: x is read after x := 2 runs
Pair(x + 0, x := 2)    ; fine: x + 0 is a new value

Hotkey "F1", () =&gt; MsgBox("hi")   ; error: Hotkey passes 1 argument

Pair(a*) =&gt; a
</textarea>
            </div>
            <div id=symbol-info class=symbol-info aria-live=polite></div>
            <div class=left-controls>
                <label><input type=checkbox id=showAll> Collapse to terminal nodes</label>
                <span id=status class=status></span>
            </div>
            <section class=problems aria-labelledby=problems-title>
                <h2 id=problems-title>Problems <span id=problems-count class=count></span></h2>
                <ul id=problems-list></ul>
                <details class=rules>
                    <summary>Lint rules</summary>
                    <ul id=rules-list></ul>
                </details>
            </section>
        </section>

        <section class=right>
            <div class=toolbar>
                <div class=tabs role=tablist>
                    <button id=tab-graph role=tab aria-selected=true>Graph</button>
                    <button id=tab-outline role=tab aria-selected=false>Outline</button>
                    <button id=tab-tokens role=tab aria-selected=false>Tokens</button>
                    <span class=tab-sep aria-hidden=true></span>
                    <button id=tab-symbols role=tab aria-selected=false title="Classes, functions, hotkeys and globals">Symbols</button>
                    <button id=tab-calls role=tab aria-selected=false title="Who calls whom, including callbacks">Calls</button>
                    <button id=tab-pattern role=tab aria-selected=false title="Search and replace by code shape">Search</button>
                    <button id=tab-steps role=tab aria-selected=false title="The order an expression runs in">Steps</button>
                </div>
                <div class="only-tree search">
                    <input id=search type=search placeholder="Find node (e.g. assignment, &quot;x&quot;)" aria-label="Find node">
                    <button id=search-prev title="Previous match (Shift+Enter)" aria-label="Previous match">↑</button>
                    <button id=search-next title="Next match (Enter)" aria-label="Next match">↓</button>
                    <span id=search-count class=count></span>
                </div>
                <div class="only-graph tool-group">
                    <button id=zoom-out title="Zoom out" aria-label="Zoom out">−</button>
                    <button id=zoom-in title="Zoom in" aria-label="Zoom in">+</button>
                    <button id=zoom-fit title="Fit to view">Fit</button>
                    <button id=zoom-100 title="Actual size">1:1</button>
                    <label title="Draw chains of single-child rules as one box"><input type=checkbox id=merge-chains checked> Merge chains</label>
                    <button id=fold-sel title="Fold or unfold the selected box; double-click a box to do the same">Fold</button>
                    <button id=unfold-all title="Show every folded subtree again">Unfold all</button>
                    <details class=menu id=graph-export>
                        <summary title="Save the graph as an image">Export</summary>
                        <div class=menu-list>
                            <button data-format=svg>SVG image</button>
                            <button data-format=png>PNG image (2×)</button>
                        </div>
                    </details>
                </div>
                <div class="only-calls tool-group">
                    <details class=menu id=calls-export>
                        <summary title="Save the call graph as an image">Export</summary>
                        <div class=menu-list>
                            <button data-format=svg>SVG image</button>
                            <button data-format=png>PNG image (2×)</button>
                        </div>
                    </details>
                </div>
                <div class="only-outline tool-group">
                    <button id=expand-all>Expand all</button>
                    <button id=collapse-all>Collapse all</button>
                </div>
                <div class="only-tokens tool-group">
                    <label><input type=checkbox id=all-tokens> All lexer tokens</label>
                </div>
            </div>
            <div id=breadcrumb class="breadcrumb hint"></div>
            <div id=stale-banner class=stale-banner hidden>The code has a lexing error, so this is the last tree that parsed. See Problems.</div>
            <div class=views>
                <div id=graph class="graph view" role=tabpanel aria-labelledby=tab-graph></div>
                <div id=outline class="outline view" role=tabpanel aria-labelledby=tab-outline hidden></div>
                <div id=tokens class="tokens view" role=tabpanel aria-labelledby=tab-tokens hidden></div>
                <div id=symbols class="panel symbols view" role=tabpanel aria-labelledby=tab-symbols hidden></div>
                <div id=calls class="calls panel view" role=tabpanel aria-labelledby=tab-calls hidden></div>
                <div id=pattern class="panel pattern view" role=tabpanel aria-labelledby=tab-pattern hidden></div>
                <div id=steps class="panel steps view" role=tabpanel aria-labelledby=tab-steps hidden></div>
            </div>
        </section>
    </main>

    <script type=module src=ahk2-antlr4-demo.6acec28e.js></script>
